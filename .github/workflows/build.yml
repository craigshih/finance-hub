name: Build site

on:
  schedule:
    - cron: "0 14 * * *"      # 每天 UTC 14:00 = 台北時間 22:00（kgi-trade-report 晚上 8～9 點把收盤價寫進 Notion 之後）
  workflow_dispatch:

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 兩個來源都是 private repo，需要一組只有 read 權限的 fine-grained token
      - uses: actions/checkout@v4
        with:
          repository: craigshih/Tim-Lu
          token: ${{ secrets.SOURCES_TOKEN }}
          path: sources/tim-lu
          sparse-checkout: data/digests

      - uses: actions/checkout@v4
        with:
          repository: craigshih/investment-team
          token: ${{ secrets.SOURCES_TOKEN }}
          path: sources/investment-team
          sparse-checkout: data/reports

      # 對帳用；token 還沒授權這個 repo 時照樣建站，只是對帳區塊會顯示沒有資料
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: craigshih/craig-stock-trade-report
          token: ${{ secrets.SOURCES_TOKEN }}
          path: sources/kgi-trade-report
          sparse-checkout: data/statements

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python build.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 第一次執行時專案還不存在，先建立；已存在時這行會失敗但不影響
          preCommands: npx wrangler pages project create craig-finance --production-branch=main || true
          command: pages deploy site --project-name=craig-finance --branch=main
