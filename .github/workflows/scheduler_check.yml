name: Scheduler check

# 檢查準時排程器用的 GH_DISPATCH_TOKEN 能不能叫兩個 repo 的 workflow。
# 最後會真的觸發一次每日一檔（當天已寄過就不會重寄），確認有「寫入」權限
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "GH_DISPATCH_TOKEN 是空的"; exit 1; }
          for target in craigshih/finance-hub/daily_pick.yml craigshih/craig-stock-trade-report/daily-price-update.yml; do
            repo=${target%/*}; wf=${target##*/}
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/actions/workflows/$wf")
            echo "$repo $wf：讀取 $code $(jq -r '.message // .state' /tmp/r.json)"
          done
          curl -s -o /dev/null -w '權限檢查（token 本身）：%{http_code}\n' -H "Authorization: Bearer $TOKEN" https://api.github.com/user
          code=$(curl -s -o /tmp/d.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main","inputs":{"send":"true"}}' "https://api.github.com/repos/craigshih/finance-hub/actions/workflows/daily_pick.yml/dispatches")
          echo "觸發測試（寫入權限）：$code $(cat /tmp/d.txt)"
          [ "$code" = 204 ]
