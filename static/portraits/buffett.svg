<rect x="104" y="98" width="28" height="20" rx="7" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
<path d="M96 106 C99 104 101 104 104 106 M68 104 L60 102 M132 104 L140 102" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"/>
<path d="M76 109 C79 106 85 106 88 109 M112 109 C115 106 121 106 124 109" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"/>
