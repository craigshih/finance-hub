<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img"><defs>
  <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <line x1="0" y1="0" x2="0" y2="5" stroke="#3a3f47" stroke-width="0.7" opacity="0.55"/>
  </pattern>
  <pattern id="hatch2" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
    <line x1="0" y1="0" x2="0" y2="4" stroke="#3a3f47" stroke-width="0.6" opacity="0.5"/>
  </pattern>
  <pattern id="hair" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(60)">
    <line x1="0" y1="0" x2="0" y2="3" stroke="#22252b" stroke-width="1.3" opacity="0.85"/>
  </pattern>
</defs><rect width="200" height="240" fill="#f6efe3"/><g filter="url(#pencil)">
<!-- 臉型：長、下垂的臉頰與雙下巴 -->
<path d="M64 88 C60 128 66 158 80 172 C90 182 110 182 120 172 C134 158 140 128 136 88" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
<path d="M82 172 C90 184 110 184 118 172" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"/>
<path d="M66 118 C68 146 76 162 88 170" fill="url(#hatch)" stroke="none" opacity=".55"/>
<!-- 禿頂與兩側短髮 -->
<path d="M64 92 C60 58 76 34 100 32 C124 34 140 58 136 92" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
<path d="M60 82 L64 74 M58 90 L63 84 M60 98 L64 92 M140 82 L136 74 M142 90 L137 84 M140 98 L136 92" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"/>
<path d="M80 50 C92 44 108 44 120 50" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width=".9" opacity=".5"/>
<!-- 耳朵 -->
<path d="M64 100 C55 98 54 116 62 122 M136 100 C145 98 146 116 138 122" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
<!-- 招牌粗框大眼鏡 -->
<rect x="66" y="94" width="31" height="25" rx="5" fill="none" stroke="#1d2026" stroke-width="5"/>
<rect x="103" y="94" width="31" height="25" rx="5" fill="none" stroke="#1d2026" stroke-width="5"/>
<path d="M97 103 L103 103 M66 100 L60 98 M134 100 L140 98" stroke="#1d2026" stroke-width="4" stroke-linecap="round"/>
<path d="M75 107 L88 107 M112 107 L125 107" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
<path d="M72 90 L90 88 M110 88 L128 90" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/>
<!-- 鼻子 -->
<path d="M100 118 C98 130 95 138 97 142 C100 145 105 144 107 141" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"/>
<!-- 嘴角微微下垂、表情嚴肅 -->
<path d="M84 156 C92 153 108 153 116 156" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
<path d="M80 140 C76 150 78 158 84 162 M120 140 C124 150 122 158 116 162" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" opacity=".8"/>
<path d="M30 240 C40 205 62 192 84 186 L100 214 L116 186 C138 192 160 205 170 240" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
<path d="M84 186 L92 240 M116 186 L108 240" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"/>
<path d="M93 196 L100 214 L107 196 L103 192 L97 192 Z" fill="url(#hatch2)" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3"/>
<path d="M97 214 L94 240 M103 214 L106 240" fill="none" stroke="#2b2f36" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"/></g></svg>